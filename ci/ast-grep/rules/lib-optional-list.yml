id: lib-optional-list
language: nix
severity: error
message: Use lib.optionals when conditionally including a list.
rule:
  all:
    - pattern: lib.optional
    - nthChild: 1
    - inside:
        all:
          - kind: apply_expression
          - nthChild: 1
          - inside:
              all:
                - kind: apply_expression
                - has:
                    kind: list_expression
                    stopBy: neighbor
              stopBy: neighbor
        stopBy: neighbor
fix: lib.optionals
