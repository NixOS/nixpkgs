id: optional-list
language: nix
severity: error
message: Use optionals when conditionally including a list.
rule:
  all:
    - kind: variable_expression
    - regex: ^optional$
    - nthChild: 1
    - inside:
        all:
          - kind: apply_expression
          - nthChild: 1
          - inside:
              all:
                - kind: apply_expression
                - has:
                    kind: list_expression
                    stopBy: neighbor
              stopBy: neighbor
        stopBy: neighbor
fix: optionals
