# Minimal SELinux policy for our tests.
#
# This is an initial MVP and can be superseded by a native Nix-to-CIL policy
# once CIL support is in nixpkgs.

class process
class process2
class file
class dir
class lnk_file
class fd

# Initial SIDs are matched by position in the kernel (1..7).
sid kernel
sid security
sid unlabeled
sid fs
sid file
sid file_labels
sid init

class process { fork transition dyntransition sigchld getattr setexec }
class process2 { nnp_transition nosuid_transition }
class file { read write open getattr map execute execute_no_trans entrypoint }
class dir { search getattr open read }
class lnk_file { read getattr }
class fd { use }

policycap nnp_nosuid_transition;

type init_t;
type unlabeled_t;
type allowed_t;
type secret_t;
type confined_svc_t;
type user_t;

attribute all_types;
typeattribute init_t all_types;
typeattribute unlabeled_t all_types;
typeattribute allowed_t all_types;
typeattribute secret_t all_types;
typeattribute confined_svc_t all_types;
typeattribute user_t all_types;

# PID 1 and unconfined OS plumbing.
allow init_t all_types : { process process2 file dir lnk_file fd } *;

# Confined service: may read allowed_t, denied secret_t.
allow confined_svc_t self : { process dir lnk_file file fd } *;
allow confined_svc_t init_t : { process fd } *;
allow confined_svc_t unlabeled_t : { dir lnk_file file } *;
allow confined_svc_t allowed_t : file { read open getattr };

# Interactive SSH user session domain.
allow user_t self : { process dir lnk_file file fd } *;
allow user_t init_t : { process fd } *;
allow user_t { unlabeled_t allowed_t } : { dir lnk_file file } *;

# Compile-time invariant enforced by checkpolicy.
neverallow { confined_svc_t user_t } secret_t : file { read open write };

role object_r;
role object_r types { unlabeled_t allowed_t secret_t };
role system_r;
role system_r types { init_t confined_svc_t };
role user_r;
role user_r types { user_t };
allow system_r user_r;

user system_u roles { system_r object_r };
user user_u roles { user_r };

sid kernel system_u:system_r:init_t
sid security system_u:object_r:unlabeled_t
sid unlabeled system_u:object_r:unlabeled_t
sid fs system_u:object_r:unlabeled_t
sid file system_u:object_r:unlabeled_t
sid file_labels system_u:object_r:unlabeled_t
sid init system_u:system_r:init_t

fs_use_xattr ext4 system_u:object_r:unlabeled_t;
fs_use_trans tmpfs system_u:object_r:unlabeled_t;
