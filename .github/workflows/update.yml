name: Update

on:
  schedule:
    - cron: '10 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      NIXPKGS_ALLOW_UNFREE: '1'
    steps:
      # Use a GitHub App when configured so generated PRs trigger CI.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: vars.NIXPKGS_CI_CLIENT_ID
        id: app-token
        with:
          client-id: ${{ vars.NIXPKGS_CI_CLIENT_ID }}
          private-key: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && vars.NIXPKGS_UPDATE_REF || github.ref_name }}
          token: &github_token ${{ steps.app-token.outputs.token || github.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update packages
        run: |
          nix-shell --option max-call-depth 100000 maintainers/scripts/update.nix \
            --arg predicate '(path: pkg: pkg.updateScript or null != null)' \
            --arg commit true \
            --arg keep-going true \
            --arg skip-prompt true

      - name: Open update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: *github_token
          branch: update/packages
          delete-branch: true
          commit-message: &commit-message 'nixpkgs: update packages'
          title: *commit-message
          body: |
            Automated update generated by `maintainers/scripts/update.nix`.
