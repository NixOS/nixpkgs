name: ISO Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    name: Build Euclid Linux 3D ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        working-directory: euclid-linux-3d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Show flake outputs
        run: |
          nix flake show \
            --extra-experimental-features "nix-command flakes"

      - name: Build ISO
        run: |
          nix build .#iso.euclid-linux-3d-iso \
            --extra-experimental-features "nix-command flakes" \
            --print-build-logs

      - name: Verify ISO
        run: |
          find result/iso -maxdepth 1 -type f -print

          if ! find result/iso -maxdepth 1 -type f -name "*.iso" | grep -q .; then
            echo "ERROR: No ISO file was generated."
            exit 1
          fi

      - name: Calculate checksum
        run: |
          cd result/iso
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: euclid-linux-3d-iso
          path: |
            euclid-linux-3d/result/iso/*.iso
            euclid-linux-3d/result/iso/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
