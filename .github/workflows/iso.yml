name: ISO Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    name: Build Euclid Linux 3D ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        working-directory: euclid-linux-3d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Show flake outputs
        run: |
          nix flake show \
            --extra-experimental-features "nix-command flakes"

      - name: Build ISO
        run: |
          nix build .#iso.euclid-linux-3d-iso \
            --extra-experimental-features "nix-command flakes" \
            --print-build-logs

      - name: Verify ISO thoroughly
        shell: bash
        run: |
          set -euo pipefail

          iso_file="$(find -L result/iso -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$iso_file" ]; then
            echo "ERROR: No ISO file was generated."
            exit 1
          fi

          echo "Found ISO: $iso_file"
          echo "ISO information:"
          ls -lh "$iso_file"
          stat "$iso_file"
          sha256sum "$iso_file"
          file "$iso_file"

          nix shell \
            nixpkgs#xorriso \
            nixpkgs#p7zip \
            nixpkgs#squashfsTools \
            --extra-experimental-features "nix-command flakes" \
            --command bash -euo pipefail -c '
              ISO="$1"
              WORK="$(mktemp -d)"

              cleanup() {
                rm -rf "$WORK"
              }

              trap cleanup EXIT

              echo "Checking ISO filesystem..."
              xorriso -indev "$ISO" -check_media --

              echo "Testing ISO archive structure..."
              7z t "$ISO"

              echo "Extracting ISO contents..."
              mkdir -p "$WORK/iso"
              7z x "$ISO" -o"$WORK/iso"

              SQUASHFS="$(find "$WORK/iso" -type f \
                \( -name "*.squashfs" -o -name "nix-store.squashfs" \) \
                -print -quit)"

              if [ -z "$SQUASHFS" ]; then
                echo "ERROR: Embedded SquashFS image was not found."
                find "$WORK/iso" -maxdepth 4 -type f -print
                exit 1
              fi

              echo "Found SquashFS: $SQUASHFS"
              ls -lh "$SQUASHFS"

              echo "Checking SquashFS metadata..."
              unsquashfs -s "$SQUASHFS"

              echo "Listing SquashFS contents..."
              unsquashfs -ll "$SQUASHFS" > /dev/null

              echo "ISO and embedded SquashFS passed verification."
            ' bash "$iso_file"

      - name: Prepare ISO artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifact
          mkdir -p artifact

          iso_file="$(find -L result/iso -type f -name '*.iso' -print -quit)"

          if [ -z "$iso_file" ]; then
            echo "ERROR: No ISO file was found."
            exit 1
          fi

          echo "Found ISO: $iso_file"

          cp -L "$iso_file" artifact/euclid-linux-3d.iso

          original_size="$(stat -c '%s' "$iso_file")"
          copied_size="$(stat -c '%s' artifact/euclid-linux-3d.iso)"

          echo "Original size: $original_size bytes"
          echo "Copied size:   $copied_size bytes"

          if [ "$original_size" != "$copied_size" ]; then
            echo "ERROR: Artifact copy has a different size."
            exit 1
          fi

          cmp "$iso_file" artifact/euclid-linux-3d.iso

          cd artifact
          sha256sum euclid-linux-3d.iso > SHA256SUMS
          cat SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: euclid-linux-3d-iso
          path: euclid-linux-3d/artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
