      colour(t) = #2f302f + (rgb(85.36, 81.22, 81.46) - #2f302f) * (1 - t)^1.91
      with t = distance from the centre / 590

    "NixOS Logomark" (nixos-logomark-white-flat-none) by Simon Frankau,
    Tim Cuthbertson and Daniel Baker (maintained by the NixOS Marketing Team),
