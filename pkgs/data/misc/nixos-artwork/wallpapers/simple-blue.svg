<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!--
    NixOS "simple-blue" wallpaper.

    Vector recreation of nix-wallpaper-simple-blue.png (1920x1080, 2016) from the
    archived NixOS/nixos-artwork repository, so that it can be rendered at
    any resolution.

    The background gradient is fitted to the original PNG:
      colour(t) = #3a4ba0 + (rgb(78.7, 118.31, 182.44) - #3a4ba0) * (1 - t)^3.66
      with t = distance from the centre / 626

    "NixOS Logomark" (nixos-logomark-white-flat-none) by Simon Frankau,
    Tim Cuthbertson and Daniel Baker (maintained by the NixOS Marketing Team),
    from https://github.com/NixOS/branding/tree/24f982b224936c2dcadaa6c8c52fba80d19b12d2,
    licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).
    Changes: scaled, centred and knocked out of a white disc.
  -->
  <defs>
    <radialGradient id="background" gradientUnits="userSpaceOnUse" cx="960" cy="540" r="626">
      <stop offset="0.0000" stop-color="#4f76b6"/>
      <stop offset="0.0417" stop-color="#4c70b3"/>
      <stop offset="0.0833" stop-color="#496ab0"/>
      <stop offset="0.1250" stop-color="#4766ae"/>
      <stop offset="0.1667" stop-color="#4561ac"/>
      <stop offset="0.2083" stop-color="#435daa"/>
      <stop offset="0.2500" stop-color="#415aa8"/>
      <stop offset="0.2917" stop-color="#4057a6"/>
      <stop offset="0.3333" stop-color="#3f55a5"/>
      <stop offset="0.3750" stop-color="#3e53a4"/>
      <stop offset="0.4167" stop-color="#3d51a3"/>
      <stop offset="0.4583" stop-color="#3c50a2"/>
      <stop offset="0.5000" stop-color="#3c4ea2"/>
      <stop offset="0.5417" stop-color="#3b4da1"/>
      <stop offset="0.5833" stop-color="#3b4da1"/>
      <stop offset="0.6250" stop-color="#3b4ca1"/>
      <stop offset="0.6667" stop-color="#3a4ca0"/>
      <stop offset="0.7083" stop-color="#3a4ba0"/>
    </radialGradient>
    <g id="logomark" transform="translate(960 540) scale(0.04774306)">
      <polygon points="-624.0 249.4153162899184 -496.0 27.712812921102 63.99999999999994 997.6612651596733 -192.00000000000006 997.6612651596733 -320.00000000000017 775.9587617908571 -448.00000000000034 997.6612651596732 -576.0000000000003 997.6612651596732 -640.0000000000003 886.8100134752651 -448.0000000000001 554.2562584220408"/>
      <polygon points="-528.0000000000001 -415.6921938165305 -272.0 -415.69219381653056 -832.0 554.2562584220408 -960.0 332.55375505322456 -832.0000000000001 110.85125168440817 -1088.0 110.85125168440794 -1152.0 -1.7053025658242404e-13 -1088.0 -110.85125168440834 -704.0000000000001 -110.85125168440811"/>
      <polygon points="95.99999999999983 -665.1075101064489 223.99999999999991 -443.4050067376326 -896.0000000000001 -443.40500673763245 -768.0000000000001 -665.1075101064487 -512.0000000000001 -665.1075101064489 -640.0 -886.8100134752652 -576.0 -997.6612651596733 -448.0 -997.6612651596733 -256.0000000000001 -665.1075101064489"/>
