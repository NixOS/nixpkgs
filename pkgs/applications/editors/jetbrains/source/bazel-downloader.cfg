# rules_go's go_sdk module extension (via rules_android) downloads the unpinned, mutable Go release
# feed https://go.dev/dl/?mode=json&include=all every time it is evaluated, to look up SDK archive hashes.
# Bazel 8 stores this checksum-less download in the repository cache, so the repo cache
# FOD hash broke whenever a new Go version/RC was published. The build never actually
# uses a Go SDK, and rules_go explicitly tolerates this download failing (it has a fallback for network-less
# builds), so we block the hosts entirely.
#
# Once intellij-community updates to Bazel 9, we can evaluate removing this file again, as then module extension
# "facts" are a thing (info is stored in the lockfile), rules_go already uses those, but since Bazel 8.4 doesn't
# know what to do with it, the hashes aren't in the lockfile with Bazel 8.
block go.dev
block golang.google.cn
